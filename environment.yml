# Conda environment of the LCA notebooks (versions tested on 2026-11-06).
# Create: conda env create -f environment.yml
# Kernel: python -m ipykernel install --user --name brightway --display-name "Python (brightway)"
name: brightway
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - scikit-umfpack=0.4.2   # fast sparse solver for bw2calc
  - pip:
      - bw2data==4.7
      - bw2calc==2.4.0
      - bw2io==0.9.17
      - bw_processing==1.6
      - numpy==2.4.6
      - pandas==3.0.5
      - scipy==1.17.1
      - plotly==7.1.0
      - ipywidgets==8.1.9
      - ipykernel==7.3.0
      - pytest==9.2.0
